<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Center — Arjun Yadav Apps</title>
    <style>
        :root {
            --primary: #2563eb;
            --text: #1e293b;
            --text-muted: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 60px 20px;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
        }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #0f172a; }
        p.subtitle { color: var(--text-muted); margin-bottom: 32px; font-size: 16px; }
        .list { display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            transform: translateY(-2px);
        }
        .card h3 { font-size: 18px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
        .card p { font-size: 14px; color: var(--text-muted); margin: 0; }
        .arrow { font-size: 20px; color: var(--primary); }
        footer { margin-top: 48px; text-align: center; font-size: 14px; color: var(--text-muted); }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Developer Privacy Center</h1>
        <p class="subtitle">Official Privacy Policies for apps published by Arjun Yadav</p>

        <div class="list">
            <a href="zeropath.html" class="card">
                <div>
                    <h3>ZeroPath: Loan & EMI Tracker</h3>
                    <p>com.arjunyadav.zeropath • Personal Finance</p>
                </div>
                <span class="arrow">→</span>
            </a>
            <a href="video-splitter.html" class="card">
                <div>
                    <h3>Auto Video Splitter for Status</h3>
                    <p>Video Players & Editors</p>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <footer>
            <p>&copy; 2026 Arjun Yadav. All rights reserved. • <a href="/">arjunyadav.com</a></p>
        </footer>
    </div>
</body>
</html>
